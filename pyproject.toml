[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switch-logo-palomitas"
version = "4.0.0"
description = "Generador moderno de parches IPS para personalizar el logo de arranque de Nintendo Switch con Atmosphère"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "D3fau4 & Kronos2308" }]
dependencies = [
  "PySide6>=6.6",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
switch-logo = "switch_logo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
